name: A股行情自动更新

on:
  push:
    branches: [master]
    paths:
      - 'dashboard/public/**'
      - 'dashboard/data/**'
      - 'scripts/**'
      - 'reports/**'
      - 'index.html'
      - 'report.html'
      - 'standalone.html'
      - '.github/workflows/update-data.yml'
  schedule:
    # 北京时间 9:00-15:00 交易时段每10分钟 (UTC+8 → UTC 1:00-7:00)
    - cron: '*/10 1-7 * * 1-5'
    # 北京时间 9:00前盘前数据 (UTC 1:00)
    - cron: '45 0 * * 1-5'
    # 其他时间每2小时
    - cron: '0 */2 * * *'
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖（仅 iconv-lite 用于 GBK 解码）
        run: npm install --no-save iconv-lite

      - name: 🚀 抓取A股实时行情（新浪财经）
        run: node scripts/fetch-sina-data.js

      - name: 📄 同步仪表盘文件到根目录
        run: |
          cp dashboard/public/index.html index.html
          cp dashboard/public/report.html report.html
          cp dashboard/public/standalone.html standalone.html

      - name: 📊 切换到 gh-pages 并推送（实时部署）
        run: |
          git config user.name "A股行情机器人"
          git config user.email "stock-bot@github.com"

          # 把所有变更（数据 + HTML）提交到当前 master 的临时 stash
          git add dashboard/data/ index.html report.html standalone.html
          if git diff --staged --quiet; then
            echo "没有数据变更，跳过"
            exit 0
          fi

          # 暂存变更
          git stash

          # 切换到 gh-pages
          git checkout gh-pages 2>/dev/null || git checkout -b gh-pages

          # 应用 master 的所有仪表盘文件覆盖 gh-pages
          git checkout master -- dashboard/public/index.html dashboard/public/report.html dashboard/public/standalone.html dashboard/data/ reports/
          cp dashboard/public/index.html index.html 2>/dev/null || true
          cp dashboard/public/report.html report.html 2>/dev/null || true
          cp dashboard/public/standalone.html standalone.html 2>/dev/null || true

          # 提交并推送 gh-pages
          git add dashboard/data/ dashboard/public/ index.html report.html standalone.html reports/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "gh-pages 无变更"
          else
            git commit -m "📊 行情数据更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') — 实时部署"
            git push origin gh-pages
            echo "✅ gh-pages 已推送，GitHub Pages 实时部署中"
          fi
