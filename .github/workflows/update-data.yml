name: 更新行情数据

on:
  schedule:
    - cron: '*/5 1-7 * * 1-5'   # 北京时间 9:00-15:00 每5分钟
    - cron: '*/30 * * * *'       # 其他时间每30分钟
  workflow_dispatch:              # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: 抓取市场数据
        run: node scripts/fetch-market-data.js

      - name: 提交数据更新
        run: |
          git config user.name "StockBot"
          git config user.email "bot@stock.local"
          git add dashboard/data/
          git diff --staged --quiet || git commit -m "📊 行情数据更新 $(date +'%Y-%m-%d %H:%M')"
          git push
