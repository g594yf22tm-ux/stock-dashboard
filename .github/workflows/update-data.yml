name: A股行情自动更新

on:
  push:
    branches: [master]
    paths:
      - 'dashboard/public/**'
      - 'dashboard/data/**'
      - 'scripts/**'
      - 'reports/**'
      - 'index.html'
      - 'report.html'
      - 'standalone.html'
      - '.github/workflows/update-data.yml'
  schedule:
    # 北京时间 9:00-15:00 交易时段每10分钟 (UTC+8 → UTC 1:00-7:00)
    - cron: '*/10 1-7 * * 1-5'
    # 其他时间每30分钟 (热门关注+关注列表+行情数据全部更新)
    - cron: '*/30 * * * *'
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖（仅 iconv-lite 用于 GBK 解码）
        run: npm install --no-save iconv-lite

      - name: 🚀 抓取A股实时行情（新浪财经）
        run: node scripts/fetch-sina-data.js

      - name: 🔬 增强分析（技术指标+分类）
        run: node scripts/enhanced-analysis.js

      - name: 📄 同步仪表盘文件到根目录
        run: |
          cp dashboard/public/index.html index.html
          cp dashboard/public/report.html report.html
          cp dashboard/public/standalone.html standalone.html

      - name: 📊 同步 gh-pages 并推送（实时部署）
        run: |
          git config user.name "A股行情机器人"
          git config user.email "stock-bot@github.com"

          # 1. 备份刚抓取的最新数据到临时目录
          TMP_DATA=$(mktemp -d)
          cp -r dashboard/data "$TMP_DATA/"
          cp index.html report.html standalone.html "$TMP_DATA/" 2>/dev/null || true

          # 2. 切换到 gh-pages
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout -b gh-pages
          git pull origin gh-pages 2>/dev/null || true

          # 3. 用备份的最新数据覆盖 gh-pages
          cp -r "$TMP_DATA/data/"* dashboard/data/ 2>/dev/null || true
          cp "$TMP_DATA"/index.html index.html 2>/dev/null || true
          cp "$TMP_DATA"/report.html report.html 2>/dev/null || true
          cp "$TMP_DATA"/standalone.html standalone.html 2>/dev/null || true
          rm -rf "$TMP_DATA"

          # 4. 提交并推送 gh-pages（始终提交，确保数据更新）
          git add dashboard/data/ index.html report.html standalone.html 2>/dev/null || true
          git commit -m "📊 行情数据更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')" || echo "数据无变化，跳过提交"
          git push origin gh-pages || echo "推送失败，重试中..."
          echo "✅ gh-pages 同步完成"
