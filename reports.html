<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分析报告 — A股仪表盘</title>
  <style>
    :root {
      --bg: #0c0c1d; --surface: #161633; --surface2: #1e1e42; --border: #2a2a55;
      --text: #e8eaed; --muted: #8890a8; --primary: #4f8cff; --accent: #f59e0b;
      --up: #ec4f5e; --down: #22c55e;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height:100vh; }
    .header {
      background: linear-gradient(135deg, #161633, #0c0c1d);
      border-bottom: 1px solid var(--border); padding: 14px 24px;
      display: flex; align-items: center; gap: 16px; position: sticky; top:0; z-index:100;
    }
    .header h1 { font-size: 1.1em; }
    .header a { color: var(--primary); text-decoration: none; font-size: 0.85em; }
    .container { max-width: 900px; margin:0 auto; padding: 20px; }
    .report-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 22px; margin-bottom: 12px;
      display: flex; align-items: center; gap: 16px; cursor: pointer;
      transition: all 0.15s;
    }
    .report-card:hover { border-color: var(--primary); background: var(--surface2); }
    .report-icon { font-size: 2em; }
    .report-info { flex:1; min-width: 0; }
    .report-info .name { font-size: 1em; font-weight: 600; }
    .report-info .meta { font-size: 0.8em; color: var(--muted); margin-top: 4px; }
    .report-info .excerpt { font-size: 0.82em; color: var(--muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .report-badge {
      display: inline-block; padding: 3px 10px; border-radius: 10px;
      font-size: 0.72em; font-weight: 600;
    }
    .badge-deep { background: rgba(79,140,255,0.15); color: var(--primary); }
    .badge-quick { background: rgba(245,158,11,0.15); color: var(--accent); }
    .loading { text-align:center; padding:60px; color:var(--muted); }
    .empty { text-align:center; padding:60px; color:var(--muted); }
    .search-bar { margin-bottom: 16px; }
    .search-bar input {
      width:100%; padding:10px 16px; border-radius:24px;
      border:1px solid var(--border); background:var(--surface);
      color:var(--text); font-size:0.9em; outline:0;
    }
    .search-bar input:focus { border-color: var(--primary); }
    .footer { text-align:center; padding:20px; color:var(--muted); font-size:0.75em; }
    @media (max-width: 640px) {
      .report-card { flex-direction:column; align-items:flex-start; }
      .report-info .excerpt { white-space: normal; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📄 分析报告</h1>
  <a href="/">← 返回仪表盘</a>
</div>

<div class="container" id="app">
  <div class="loading">⏳ 加载报告列表...</div>
</div>

<div class="footer">AI 辅助生成 · 仅供参考，不构成投资建议</div>

<script>
async function loadReports() {
  try {
    const r = await fetch('/api/reports');
    const data = await r.json();
    const reports = data.reports || [];

    if (!reports.length) {
      document.getElementById('app').innerHTML = '<div class="empty">📭 暂无分析报告<br><br><a href="/">← 返回仪表盘</a></div>';
      return;
    }

    // Group by ticker
    const groups = {};
    reports.forEach(r => {
      if (!groups[r.ticker]) groups[r.ticker] = [];
      groups[r.ticker].push(r);
    });

    document.getElementById('app').innerHTML = `
      <div class="search-bar">
        <input type="text" placeholder="🔍 搜索报告（代码/名称/类型）..." oninput="filterReports(this.value)">
      </div>
      <div id="reportList">
        ${reports.map((r, i) => `
          <div class="report-card" data-search="${r.ticker} ${r.title} ${r.type}" onclick="openReport('${encodeURIComponent(r.filename)}')">
            <div class="report-icon">${r.type.includes('deep') ? '📊' : '📋'}</div>
            <div class="report-info">
              <div class="name">${r.title}</div>
              <div class="meta">${r.date} · <span class="report-badge ${r.type.includes('deep')?'badge-deep':'badge-quick'}">${r.type}</span></div>
              ${r.excerpt ? `<div class="excerpt">${r.excerpt}</div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="empty">❌ 加载失败: ${e.message}<br><br><a href="/">← 返回仪表盘</a></div>`;
  }
}

function openReport(filename) {
  window.location.href = '/report.html?file=' + filename;
}

function filterReports(q) {
  const cards = document.querySelectorAll('.report-card');
  const term = q.toLowerCase();
  cards.forEach(c => {
    const text = (c.getAttribute('data-search') || '').toLowerCase();
    c.style.display = term ? (text.includes(term) ? '' : 'none') : '';
  });
}

loadReports();
</script>
</body>
</html>
