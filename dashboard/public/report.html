<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分析报告</title>
  <style>
    :root {
      --bg: #f1f5f9; --card: #fff; --border: #e2e8f0;
      --text: #1e293b; --muted: #64748b; --primary: #2563eb;
      --up: #dc2626; --down: #16a34a; --accent: #d97706;
      --font: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --mono: 'JetBrains Mono', 'Consolas', monospace;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.85; }

    .topbar {
      background:#1e293b; color:#fff; padding:12px 24px;
      display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:100;
    }
    .topbar a { color:#94a3b8; text-decoration:none; font-size:0.85em; }
    .topbar a:hover { color:#fff; }
    .topbar .title { font-weight:700; font-size:1em; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .btn { padding:5px 12px; border-radius:6px; border:1px solid #475569; background:transparent; color:#cbd5e1; cursor:pointer; font-size:0.8em; text-decoration:none; transition:all 0.15s; }
    .btn:hover { background:#334155; color:#fff; }

    .container { max-width:860px; margin:0 auto; padding:28px 20px 60px; }

    .report-hero {
      background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);
      color:#fff; border-radius:16px; padding:36px; margin-bottom:28px;
    }
    .report-hero .stock { font-size:1.8em; font-weight:700; }
    .report-hero .meta { font-size:0.85em; color:#94a3b8; margin:6px 0 18px; }
    .hero-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
    .hero-m { background:rgba(255,255,255,0.07); border-radius:10px; padding:12px; }
    .hero-m .l { font-size:0.72em; color:#94a3b8; }
    .hero-m .v { font-size:1.2em; font-weight:700; font-family:var(--mono); margin-top:2px; }
    .hero-m .s { font-size:0.72em; margin-top:2px; }

    .toc {
      background:var(--card); border:1px solid var(--border);
      border-radius:12px; padding:18px 22px; margin-bottom:24px;
    }
    .toc h3 { font-size:0.85em; color:var(--muted); margin-bottom:10px; }
    .toc a { display:block; padding:3px 0; color:var(--primary); text-decoration:none; font-size:0.88em; }
    .toc a:hover { text-decoration:underline; }

    .section {
      background:var(--card); border:1px solid var(--border);
      border-radius:14px; padding:30px 32px; margin-bottom:18px;
    }
    .section h2 { font-size:1.15em; margin-bottom:16px; padding-bottom:10px; border-bottom:2px solid var(--primary); display:flex; align-items:center; gap:8px; }
    .section h3 { font-size:1em; margin:22px 0 10px; color:var(--muted); }
    .section p { margin-bottom:10px; }
    .section ul, .section ol { margin:8px 0 12px 20px; }
    .section li { margin-bottom:4px; }
    .section blockquote {
      border-left:3px solid var(--accent); padding:10px 16px; margin:14px 0;
      background:#fffbeb; border-radius:0 8px 8px 0; color:#92400e; font-size:0.95em;
    }
    .section hr { border:none; border-top:1px solid var(--border); margin:20px 0; }

    .table-wrap { overflow-x:auto; margin:14px 0; }
    table { width:100%; border-collapse:collapse; font-size:0.88em; }
    th { background:#f1f5f9; padding:9px 12px; text-align:left; font-weight:600; color:var(--muted); border-bottom:2px solid var(--border); font-size:0.8em; white-space:nowrap; }
    td { padding:9px 12px; border-bottom:1px solid var(--border); }
    tr:hover td { background:#f8fafc; }
    .up { color:var(--up); font-weight:600; }
    .down { color:var(--down); font-weight:600; }

    .badge { display:inline-block; padding:2px 10px; border-radius:12px; font-size:0.8em; font-weight:700; }
    .badge.buy { background:#fef2f2; color:var(--up); }
    .badge.hold { background:#fffbeb; color:var(--accent); }
    .badge.watch { background:#eff6ff; color:var(--primary); }

    .score-bar { display:flex; align-items:center; gap:10px; margin:5px 0; }
    .score-bar .lb { width:70px; font-size:0.85em; color:var(--muted); }
    .score-bar .tr { flex:1; height:8px; background:#e2e8f0; border-radius:4px; overflow:hidden; }
    .score-bar .fl { height:100%; border-radius:4px; }

    .loading { text-align:center; padding:80px; color:var(--muted); }
    .spinner { width:32px; height:32px; border:3px solid #e2e8f0; border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 14px; }
    @keyframes spin { to{transform:rotate(360deg)} }

    .footer { text-align:center; color:var(--muted); font-size:0.8em; padding:20px; border-top:1px solid var(--border); margin-top:16px; }

    @media (max-width:640px) {
      .report-hero { padding:20px; } .report-hero .stock { font-size:1.3em; }
      .section { padding:18px; } .container { padding:10px; }
    }
    @media print {
      .topbar,.toc { display:none; } body { background:#fff; font-size:12px; }
      .container { max-width:100%; padding:0; }
      .section { break-inside:avoid; box-shadow:none; border:1px solid #ddd; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <a href="/">← 返回</a>
  <span class="title" id="reportTitle">分析报告</span>
  <button class="btn" onclick="copyLink()">🔗 复制链接</button>
  <button class="btn" onclick="window.print()">🖨️ 打印</button>
</div>

<div class="container" id="content"><div class="loading"><div class="spinner"></div>加载中...</div></div>

<div class="footer">AI 辅助生成 | 新浪财经实时行情 | 仅供参考，不构成投资建议</div>

<script>
const p = new URLSearchParams(location.search);
const file = p.get('file') || '';

if (!file) document.getElementById('content').innerHTML = '<div class="loading">⚠️ 未指定报告<br><br><a href="/">← 返回仪表盘</a></div>';
else load(file);

function copyLink() {
  const url = location.href;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.querySelector('.topbar .btn');
    const orig = btn.textContent;
    btn.textContent = '✅ 已复制';
    setTimeout(() => btn.textContent = orig, 1500);
  }).catch(() => alert('复制失败，请手动复制地址栏'));
}

async function load(fn) {
  try {
    const r = await fetch('/reports/'+fn);
    if (!r.ok) throw new Error('不存在');
    const md = await r.text();
    document.getElementById('reportTitle').textContent = fn.replace(/\.md$/,'').replace(/_/g,' ');
    document.getElementById('content').innerHTML = renderMD(md);
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="loading">❌ 加载失败<br><small>'+e.message+'</small><br><br><a href="/">返回</a></div>';
  }
}

function renderMD(md) {
  const lines = md.split('\n');
  let out = '', toc = [], heroHTML = '', inCode = false;
  let buf = '', tableBuf = '', inTable = false, sectionOpen = false;
  let heroDone = false, firstH1 = true;

  function flushBuf() {
    if (!buf.trim()) { buf = ''; return; }
    out += '<p>' + fmt(buf.trim()) + '</p>';
    buf = '';
  }
  function flushTable() {
    if (tableBuf) { out += '<div class="table-wrap"><table>'+tableBuf+'</table></div>'; tableBuf = ''; }
    inTable = false;
  }

  function closeSection() {
    if (sectionOpen) { flushBuf(); flushTable(); out += '</div>'; sectionOpen = false; }
  }

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const line = raw.trim();

    // code fence
    if (raw.startsWith('```')) { inCode = !inCode; continue; }
    if (inCode) continue;

    // empty line
    if (!line) {
      if (inTable) continue;
      flushBuf(); flushTable();
      continue;
    }

    // horizontal rule — 不关闭 section，仅作视觉分割
    if (line === '---' || line === '***') { flushBuf(); flushTable(); out += '<hr>'; continue; }

    // h1 → hero
    if (line.startsWith('# ') && firstH1) {
      firstH1 = false;
      const title = line.slice(2);
      // look ahead for date/analyst lines
      let meta1 = '', meta2 = '';
      let j = i + 1; while (j < lines.length && !lines[j].trim()) j++;
      if (j < lines.length && lines[j].includes('**日期**')) { meta1 = lines[j]; i = j; }
      j++; while (j < lines.length && !lines[j].trim()) j++;
      if (j < lines.length && lines[j].includes('**分析师**')) { meta2 = lines[j]; i = j; }
      heroHTML = `<div class="report-hero"><div class="stock">${title}</div><div class="meta">${fmt(meta1)} &nbsp;|&nbsp; ${fmt(meta2)}</div>`;
      heroDone = false;
      continue;
    }

    // h2 → section
    if (line.startsWith('## ')) {
      closeSection();
      const title = line.slice(3);
      const id = 's'+toc.length;
      toc.push({ title, id });
      out += `<div class="section" id="${id}"><h2>${title}</h2>`;
      sectionOpen = true;
      continue;
    }

    // h3 → sub-heading in section
    if (line.startsWith('### ')) {
      flushBuf(); flushTable();
      out += '<h3>'+line.slice(4)+'</h3>';
      continue;
    }

    // table
    if (line.startsWith('|') && !line.startsWith('|--') && !line.startsWith('|:-')) {
      if (!inTable) { flushBuf(); inTable = true; }
      const cells = line.split('|').filter(c => c.trim());
      // detect header (next line is separator)
      let isHeader = false;
      if (i + 1 < lines.length) {
        const next = lines[i+1].trim();
        if (/^\|[\s\-:]+\|/.test(next)) { isHeader = true; i++; }
      }
      const tag = isHeader ? 'th' : 'td';
      tableBuf += '<tr>'+cells.map(c => {
        let v = c.trim();
        v = v.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
        const cls = /^\+|↑/.test(v) ? 'up' : /^\-|↓/.test(v) ? 'down' : '';
        return `<${tag} class="${cls}">${v}</${tag}>`;
      }).join('')+'</tr>';
      continue;
    }

    if (inTable) { flushTable(); }

    // blockquote
    if (line.startsWith('> ')) {
      flushBuf();
      out += '<blockquote>'+fmt(line.slice(2))+'</blockquote>';
      continue;
    }

    // unordered list
    if (line.match(/^[\-\*]\s/)) {
      out += '<li>'+fmt(line.replace(/^[\-\*]\s/, ''))+'</li>';
      continue;
    }

    // ordered list
    if (line.match(/^\d+\.\s/)) {
      out += '<li>'+fmt(line.replace(/^\d+\.\s/, ''))+'</li>';
      continue;
    }

    // bold-only line
    if (/^\*\*.+\*\*$/.test(line)) { flushBuf(); out += '<p><b>'+fmt(line.replace(/\*\*/g,''))+'</b></p>'; continue; }

    // normal text
    buf += (buf ? ' ' : '') + line;
  }

  closeSection();
  flushTable();
  flushBuf();

  // 生成 TOC
  let tocHTML = '';
  if (toc.length > 1) {
    tocHTML = '<div class="toc"><h3>📑 目录</h3>'+toc.map(t=>`<a href="#${t.id}">${t.title}</a>`).join('')+'</div>';
  }

  // 把 TOC 插入 hero 之后
  const full = heroHTML + '</div>' + tocHTML + out;
  return full;
}

function fmt(t) {
  if (!t) return '';
  return t
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\*(.+?)\*/g, '<i>$1</i>')
    .replace(/`([^`]+)`/g, '<code style="background:#f1f5f9;padding:1px 5px;border-radius:3px;font-size:0.9em">$1</code>');
}
</script>
</body>
</html>
